<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dcecff"><title>Мои финансы</title><style>
:root{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233b56;background:#edf5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 5%,#fff,transparent 40%),#edf5ff}main{max-width:940px;margin:auto;padding:28px 18px 100px}h1{font-size:32px;margin:4px 0 24px}h2{font-size:20px}.muted{color:#8192a6}.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;color:#84a2c6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#ffffffdb;border:1px solid #fff;box-shadow:0 15px 45px #90b1d127;border-radius:24px;padding:22px;margin-bottom:15px;backdrop-filter:blur(15px);animation:rise .35s both}.card strong{font-size:25px;display:block;margin-top:10px}.green{color:#20a781}.red{color:#ef7e83}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:13px 18px;background:#4c97eb;color:white;font-weight:750;box-shadow:0 7px 14px #3886d533;transition:transform .22s,box-shadow .22s,filter .22s}.btn:hover{filter:brightness(1.1);box-shadow:0 0 0 4px #77b7ff33,0 12px 22px #3886d550}.btn:active{transform:scale(.92)}.secondary{background:#eaf3ff;color:#4775a9;box-shadow:none}.nav{position:sticky;top:0;background:#edf5ffed;z-index:2;display:flex;gap:9px;padding:12px 0;overflow:auto}.nav button{white-space:nowrap}.item{padding:13px 0;border-bottom:1px solid #e9f0f7;display:flex;align-items:center;gap:12px}.item:last-child{border:0}.item .info{flex:1;min-width:0}.item small{color:#91a2b7}.item b{font-size:17px}input,select{width:100%;border:1px solid #dceafa;border-radius:13px;padding:12px;background:#f8fbff;color:#23415d;font-size:16px}label{display:block;margin:12px 0 5px;font-weight:650}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.tag{font-size:12px;color:#5888bb;background:#e5f2ff;border-radius:20px;padding:7px 12px}.floating{position:fixed;bottom:20px;right:20px;border-radius:50%;font-size:27px;width:60px;height:60px;z-index:4}@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:span 2}main{padding:14px 14px 90px}h1{font-size:27px}.card{padding:18px;border-radius:21px}}
</style></head><body><main><div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Мои финансы ✦</h1><nav class="nav"><button class="btn secondary" onclick="tab('overview')">Обзор</button><button class="btn secondary" onclick="tab('history')">История</button><button class="btn secondary" onclick="tab('add')">+ Добавить</button><button class="btn secondary" onclick="tab('recurring')">Платежи</button><button class="btn secondary" onclick="tab('settings')">Настройки</button></nav><section id="view"></section><button class="btn floating" onclick="tab('add')">+</button></main><script>
const K='moi-finansy-private-v1',S='moi-finansy-settings-v1';let db,settings;try{db=JSON.parse(localStorage.getItem(K))||{transactions:[],recurring:[]}}catch{db={transactions:[],recurring:[]}};try{settings=JSON.parse(localStorage.getItem(S))||{time:'08:45',enabled:true}}catch{settings={time:'08:45',enabled:true}};const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(n||0),escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(K,JSON.stringify(db));tab(current)}let current='overview';function totals(){return db.transactions.reduce((x,t)=>(x[t.type]+=Number(t.amount)||0,x),{income:0,expense:0})}function tab(x){current=x;let v=$('#view');if(x==='overview'){let t=totals();v.innerHTML='<div class="grid"><div class="card"><span class="muted">Доходы</span><strong class="green">'+money(t.income)+'</strong></div><div class="card"><span class="muted">Расходы</span><strong class="red">'+money(t.expense)+'</strong></div><div class="card"><span class="muted">Баланс операций</span><strong>'+money(t.income-t.expense)+'</strong></div></div><div class="card"><h2>Последние операции</h2>'+rows(db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))+'</div><div class="card"><span class="tag">🔒 Только на этом устройстве</span><p class="muted">Данные не отправляются на GitHub и не синхронизируются между устройствами. Для переноса используй экспорт и импорт.</p></div>'}if(x==='history')v.innerHTML='<div class="card"><h2>История операций</h2>'+rows(db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)),true)+'</div>';if(x==='add')v.innerHTML='<div class="card"><h2>Новая операция</h2><form onsubmit="add(event)"><label>Тип</label><select id="type"><option value="expense">Расход</option><option value="income">Доход</option></select><label>Название</label><input required id="name" placeholder="Кофе, продукты, оплата работы"><div class="two"><div><label>Сумма, ₽</label><input required type="number" min=".01" step=".01" id="amount"></div><div><label>Дата</label><input required type="date" id="date" value="'+today()+'"></div></div><p><button class="btn" type="submit">Сохранить ✨</button></p></form></div><div class="card"><h2>📷 Из скриншота</h2><p class="muted">Выбери скриншот: его можно просмотреть, затем вручную перенести сумму и название. Автоматическое распознавание пока не подключено.</p><input type="file" accept="image/*" onchange="preview(this)"><p><img id="preview" style="max-width:100%;border-radius:15px;display:none"></p></div>';if(x==='recurring')v.innerHTML='<div class="card"><h2>Ежемесячные платежи</h2>'+db.recurring.map((r,i)=>'<div class="item"><div class="info">'+escapeHTML(r.name)+'</div><b>'+money(r.amount)+'</b><button class="btn secondary" onclick="removeRecurring('+i+')">×</button></div>').join('')+'<form onsubmit="addRecurring(event)"><label>Название</label><input id="rname" required placeholder="Аренда, МТС"><label>Сумма</label><input id="ramount" type="number" step=".01" min=".01" required><p><button class="btn">Добавить платёж</button></p></form></div>';if(x==='settings')v.innerHTML='<div class="card"><h2>Настройки и резервная копия</h2><p class="muted">Напоминания работают, когда вкладка открыта и браузер разрешил уведомления.</p><label>Время напоминания</label><input id="remindTime" type="time" value="'+settings.time+'"><p><button class="btn" onclick="reminder()">Сохранить напоминание</button></p><hr style="border:0;border-top:1px solid #e7f0f9;margin:25px 0"><div class="buttons"><button class="btn" onclick="exportData()">Скачать JSON</button><button class="btn secondary" onclick="exportCSV()">Экспорт CSV</button></div><label>Импорт резервной копии JSON</label><input type="file" accept=".json,application/json" onchange="importData(this)"><p class="muted">Храни резервную копию в защищённом месте. Это личные финансовые данные.</p></div>'} }function rows(arr,del=false){return arr.length?arr.map(t=>'<div class="item"><div class="info"><b>'+escapeHTML(t.name)+'</b><br><small>'+escapeHTML(t.date)+'</small></div><b class="'+(t.type==='income'?'green':'red')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</b>'+(del?'<button class="btn secondary" onclick="removeTx('+JSON.stringify(t.id)+')">×</button>':'')+'</div>').join(''):'<p class="muted">Записей пока нет. Добавь первую операцию или загрузи резервную копию.</p>'}function add(e){e.preventDefault();db.transactions.push({id:String(Date.now())+Math.random(),type:$('#type').value,name:$('#name').value.trim(),amount:+$('#amount').value,date:$('#date').value});save();tab('overview')}function removeTx(id){if(confirm('Удалить запись?')){db.transactions=db.transactions.filter(t=>t.id!==id);save()}}function addRecurring(e){e.preventDefault();db.recurring.push({name:$('#rname').value,amount:+$('#ramount').value});save()}function removeRecurring(i){db.recurring.splice(i,1);save()}function preview(el){let f=el.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=$('#preview');im.src=u;im.style.display='block'}function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('moi-finansy-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let rr=[['Дата','Тип','Название','Сумма'],...db.transactions.map(t=>[t.date,t.type,t.name,t.amount])];download('moi-finansy.csv','\ufeff'+rr.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv')}async function importData(inp){let f=inp.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.transactions)||!Array.isArray(x.recurring))throw Error('Неверный формат');if(!confirm('Импорт заменит текущие записи на этом устройстве. Продолжить?'))return;db=x;save();alert('Данные импортированы')}catch(e){alert('Ошибка импорта: '+e.message)}}async function reminder(){settings.time=$('#remindTime').value;settings.enabled=true;localStorage.setItem(S,JSON.stringify(settings));if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();alert('Время напоминания сохранено')}setInterval(()=>{let d=new Date(),hm=d.toTimeString().slice(0,5),day=d.toDateString();if(settings.enabled&&hm===settings.time&&settings.last!==day){settings.last=day;localStorage.setItem(S,JSON.stringify(settings));if('Notification'in window&&Notification.permission==='granted')new Notification('Мои финансы',{body:'Пора записать вчерашние расходы и доходы'});else alert('Пора записать доходы и расходы!')}},30000);tab('overview');
</script></body></html>
